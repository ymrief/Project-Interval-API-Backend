# Pengembangan lokal. Juga dipakai test (profil bawaan); koneksi database di test
# diambil dari Testcontainers sehingga nilai datasource di bawah tidak terpakai.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interval_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Secret HANYA untuk pengembangan. ProductionSafetyCheck menolak nilai ini di profil prod.
interval.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-0123456789}

# FCM dimatikan: push hanya dicatat di log dan TIDAK dikirim ke perangkat.
interval.notification.fcm.enabled=${FCM_ENABLED:false}
interval.notification.fcm.credentials-path=${FCM_CREDENTIALS_PATH:}

logging.level.com.interval.apibackend=DEBUG
