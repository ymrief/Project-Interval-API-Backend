spring.application.name=interval-api-backend

# Profil bawaan = dev (pengembangan lokal dan test). Production: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# ---------------------------------------------------------------------------
# JPA / Hibernate. Skema HANYA berubah lewat Flyway; Hibernate hanya memvalidasi.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Semua waktu dibaca/ditulis sebagai UTC (kolom DATETIME tidak menyimpan zona waktu)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---------------------------------------------------------------------------
# Actuator: hanya health (untuk Docker/orkestrator), tanpa detail
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Aplikasi (nilai bawaan; semuanya bisa diganti per profil atau environment variable)
# ---------------------------------------------------------------------------
interval.jwt.access-token-ttl=15m
interval.jwt.refresh-token-ttl=30d

interval.occurrence.horizon=48h
interval.occurrence.missed-after=60m

interval.security.login-rate-limit.enabled=true
interval.security.login-rate-limit.max-failures-per-email=5
interval.security.login-rate-limit.max-failures-per-ip=20
interval.security.login-rate-limit.window=15m

interval.maintenance.refresh-token-retention=7d
