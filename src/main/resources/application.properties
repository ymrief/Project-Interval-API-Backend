spring.application.name=interval-api-backend

# Active Profile
spring.profiles.default=local

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection Pool - HikariCP
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true

# Prevent Open Session in View
spring.jpa.open-in-view=false

# Jackson
spring.jackson.time-zone=UTC

# JWT Configuration
interval.jwt.secret=${JWT_SECRET}
interval.jwt.access-token-ttl=15m
interval.jwt.refresh-token-ttl=30d

# Menghilangkan log "Using generated security password" default Spring Security
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Firebase Cloud Messaging (FCM)
interval.notification.fcm.enabled=false
# Aktifkan di production:
# interval.notification.fcm.enabled=true
# interval.notification.fcm.credentials-path=${FCM_PATH}