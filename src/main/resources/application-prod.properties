# Production. Semua rahasia dan alamat dari environment variable, TANPA nilai bawaan:
# jika ada yang kosong aplikasi gagal start (fail fast), bukan berjalan dengan konfigurasi salah.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}

spring.jpa.show-sql=false

interval.jwt.secret=${JWT_SECRET}

# FCM wajib aktif di production (dicek ProductionSafetyCheck).
interval.notification.fcm.enabled=true
interval.notification.fcm.credentials-path=${FCM_CREDENTIALS_PATH}

# Dokumentasi API dimatikan secara default. Nyalakan hanya jika memang perlu: SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Jangan bocorkan detail error ke klien
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Di belakang reverse proxy (nginx, load balancer), aktifkan agar IP klien benar untuk rate limiting login.
# Aktifkan HANYA jika proxy tepercaya; tanpa proxy, header X-Forwarded-For bisa dipalsukan klien.
# server.forward-headers-strategy=native

logging.level.root=INFO
logging.level.com.interval.apibackend=INFO
